name: cedar

networks:
  cedar-network:

x-cedar-risk: &cedar-risk
  networks: [cedar-network]
  env_file: .env              # same settings as a local run (PILOTS, GRAPH_*, KAFKA_*, LOG_*)
  environment:
    # the local broker is kafka:9094 on this network (localhost:8004 is the
    # host's); without KAFKA_DOCKER_BOOTSTRAP_SERVERS (production) the .env value
    KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_DOCKER_BOOTSTRAP_SERVERS:-${KAFKA_BOOTSTRAP_SERVERS}}
    # the credentials folder of .env, mounted read-only below
    KAFKA_CREDENTIALS_DIR: /app/kafka-credentials
    KAFKA_CA_FILE: ""
    KAFKA_CERT_FILE: ""
    KAFKA_KEY_FILE: ""
  volumes:
    - ./outputs:/app/outputs  # saved responses
    - ./logs:/app/logs        # log files
    - ${KAFKA_CREDENTIALS_DIR:?set KAFKA_CREDENTIALS_DIR in .env}:/app/kafka-credentials:ro
  restart: unless-stopped

services:
  # ---- CEDAR risk tool: `python main.py` from the source -------------------
  #   docker compose --profile source up --build
  cedar-risk:
    <<: *cedar-risk
    profiles: ["source"]
    build: { context: ., target: source }
    image: cedar-risk:source
    container_name: cedar-risk

  # ---- CEDAR risk tool: the built (pip-installed) wheel --------------------
  #   docker compose --profile package up --build
  cedar-risk-package:
    <<: *cedar-risk
    profiles: ["package"]
    build: { context: ., target: package }
    image: cedar-risk:package
    container_name: cedar-risk-package

  # ---- Neo4j (graph database) ----------------------------------------------
  neo4j:
    profiles: ["local-neo4j"]
    image: neo4j:latest
    container_name: neo4j
    networks: [cedar-network]
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # ---- HTTP endpoint exposing the graph ------------------------------------
  cedar-http-api:
    profiles: ["local-neo4j"]
    build: ./neo4j-api
    image: cedar-http-api
    container_name: cedar-http-api
    networks: [cedar-network]
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    restart: on-failure

  # ---- Kafka broker: local replica of the CEDAR production cluster ----------
  # Same security as production (secure-kafka/README.md): SASL_SSL = TLS with
  # a REQUIRED client certificate signed by the CA + SASL PLAIN user/password.
  # Credentials: ./kafka/make-local-credentials.sh (local CA, not production).
  kafka:
    profiles: ["local-kafka"]
    image: apache/kafka:3.9.0
    container_name: kafka-local
    hostname: kafka
    networks: [cedar-network]

    ports:
      # host access, on the production port: localhost:8004
      - "8004:8004"

    volumes:
      - ./kafka/secrets/local/broker:/etc/kafka/secrets:ro

    environment:
      # ---- KRaft -----------------------------------------------------------
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      # ---- Listeners -------------------------------------------------------
      #   EXTERNAL    host applications       localhost:8004  (production: kafka.cedar-heu-project.eu:8004)
      #   INTERNAL    other Docker containers kafka:9094
      #   CONTROLLER  KRaft, inside the broker only
      # (the names must not contain "SSL": the image's own SSL setup would take over)
      KAFKA_LISTENERS: EXTERNAL://:8004,INTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:8004,INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:SASL_SSL,INTERNAL:SASL_SSL,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # ---- TLS: broker certificate + CA, client certificate required ------
      KAFKA_SSL_KEYSTORE_TYPE: PEM
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/broker.pem
      KAFKA_SSL_TRUSTSTORE_TYPE: PEM
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka-cedar-ca-1.crt
      # on SASL_SSL listeners Kafka ignores the global ssl.client.auth:
      # it must be set per listener (listener.name.<name>.ssl.client.auth)
      KAFKA_LISTENER_NAME_EXTERNAL_SSL_CLIENT_AUTH: required
      KAFKA_LISTENER_NAME_INTERNAL_SSL_CLIENT_AUTH: required

      # ---- SASL PLAIN: users in kafka_server_jaas.conf ---------------------
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf"

      # ---- Single broker ---------------------------------------------------
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # responses for "all" carry the whole graph (kafka_client.MAX_MESSAGE_BYTES)
      KAFKA_MESSAGE_MAX_BYTES: 10485760

  # ---- Kafka topic initialization ------------------------------------------
  kafka-init:
    profiles: ["local-kafka"]
    image: apache/kafka:3.9.0
    container_name: kafka-init
    hostname: kafka-init
    networks: [cedar-network]

    depends_on:
      - kafka

    volumes:
      - ./kafka/secrets/local/broker:/etc/kafka/secrets:ro

    entrypoint: ["/bin/bash", "-c"]

    command:
      - |
        CONFIG=/etc/kafka/secrets/admin-client.properties
        echo "Waiting for Kafka..."

        until /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9094 \
          --list \
          --command-config $$CONFIG >/dev/null 2>&1
        do
          echo "Kafka not ready yet..."
          sleep 2
        done

        echo "Kafka is ready."

        echo "Creating Kafka topics..."

        for topic in \
          it_analyse \
          it_results_available \
          sl_analyse \
          sl_results_available
        do
          echo "Creating topic: $$topic"

          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:9094 \
            --create \
            --if-not-exists \
            --topic "$$topic" \
            --partitions 1 \
            --replication-factor 1 \
            --command-config $$CONFIG
        done

        echo ""
        echo "Kafka topics created successfully."
        echo ""
        echo "Available topics:"

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9094 \
          --list \
          --command-config $$CONFIG
