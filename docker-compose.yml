name: cedar

# The CEDAR risk module only. The local test infrastructure has its own files:
#   kafka/docker-compose.yml                 local Kafka broker (replica of production)
#   synthetic_anomalies/docker-compose.yml   local Neo4j + synthetic anomaly graph

x-cedar-risk: &cedar-risk
  # the host's network: localhost and host names mean the same as for
  # `python main.py`, so KAFKA_BOOTSTRAP_SERVERS in .env alone picks the broker
  # (localhost:8004 = the local one, echo:8004 = echo, production, ...)
  network_mode: host
  # run as the host user, so the files it writes in outputs/ and logs/ are yours
  # (as root they could not be opened by `python main.py` any more); `make` passes
  # your ids, else 1000 = the first user of the machine
  user: "${CEDAR_UID:-1000}:${CEDAR_GID:-1000}"
  env_file: .env              # same settings as a local run (PILOTS, GRAPH_*, KAFKA_*, LOG_*)
  environment:
    # the credentials folder of .env, mounted read-only below
    KAFKA_CREDENTIALS_DIR: /app/kafka-credentials
    KAFKA_CA_FILE: ""
    KAFKA_CERT_FILE: ""
    KAFKA_KEY_FILE: ""
    # OUTPUT_DIR of .env is mounted at /app/outputs; unset -> not saved
    OUTPUT_DIR: ${OUTPUT_DIR:+/app/outputs}
  volumes:
    - ${OUTPUT_DIR:-./outputs}:/app/outputs   # saved responses (if OUTPUT_DIR is set)
    - ./logs:/app/logs        # log files
    - ${KAFKA_CREDENTIALS_DIR:?set KAFKA_CREDENTIALS_DIR in .env}:/app/kafka-credentials:ro
  restart: unless-stopped

services:
  # ---- The module: the built (pip-installed) package -- the default --------
  #   make run    (= remove any cedar-risk container, then docker compose up -d --build)
  # Both services use the container name cedar-risk, so only one runs at a time:
  # remove the existing one before starting the other.
  cedar-risk-package:
    <<: *cedar-risk
    build: { context: ., target: package }
    image: cedar-risk:package
    container_name: cedar-risk

  # ---- Optional: `python main.py` from the source (development) ------------
  #   docker rm -f cedar-risk; docker compose up -d --build cedar-risk
  cedar-risk:
    <<: *cedar-risk
    profiles: ["source"]
    build: { context: ., target: source }
    image: cedar-risk:source
    container_name: cedar-risk
