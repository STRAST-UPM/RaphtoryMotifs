name: cedar


x-cedar-risk: &cedar-risk
  # `python main.py`, so KAFKA_BOOTSTRAP_SERVERS in .env alone picks the broker
  env_file: .env              # same settings as a local run (PILOTS, GRAPH_*, KAFKA_*, LOG_*)
  environment:
    # the credentials folder of .env, mounted read-only below
    KAFKA_CREDENTIALS_DIR: /app/kafka-credentials
    KAFKA_CA_FILE: ""
    KAFKA_CERT_FILE: ""
    KAFKA_KEY_FILE: ""
    # OUTPUT_DIR of .env is mounted at /app/outputs; unset -> not saved
    OUTPUT_DIR: ${OUTPUT_DIR:+/app/outputs}
  volumes:
    - ${OUTPUT_DIR:-./outputs}:/app/outputs   # saved responses (if OUTPUT_DIR is set)
    - ./logs:/app/logs        # log files
    - ${KAFKA_CREDENTIALS_DIR:?set KAFKA_CREDENTIALS_DIR in .env}:/app/kafka-credentials:ro
  restart: unless-stopped

services:
  cedar-risk:
    <<: *cedar-risk
    build: { context: ., target: package }
    image: cedar-risk:package
    container_name: cedar-risk

  # ---- Optional: `python main.py` from the source (development) ------------
  cedar-risk-source:
    <<: *cedar-risk
    profiles: ["source"]
    build: { context: ., target: source }
    image: cedar-risk:source
    container_name: cedar-risk
