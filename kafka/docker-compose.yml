# Local Kafka broker: a replica of the CEDAR production cluster, for testing.
# Same security as production (secure-kafka/README.md): SASL_SSL = TLS with a
# REQUIRED client certificate signed by the CA + SASL PLAIN user/password.
#
#   ./kafka/make-local-credentials.sh                   # once: local CA + credentials
#   docker compose -f kafka/docker-compose.yml up -d    # broker on localhost:8004 + topics
#   docker compose -f kafka/docker-compose.yml down
#
# One setting, shared with the module: KAFKA_BOOTSTRAP_SERVERS in the root .env.
# The broker advertises its host, so the same files work on every machine:
#   localhost:8004  -> this machine's broker, advertised as localhost
#   echo:8004       -> on echo, the broker advertises echo
# (that host must be in the broker certificate: make-local-credentials.sh adds it)
name: cedar-kafka

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka-local
    hostname: kafka

    ports:
      # host access, on the production port: localhost:8004
      - "8004:8004"

    volumes:
      - ./secrets/local/broker:/etc/kafka/secrets:ro
      # the root .env, as a FILE: only KAFKA_BOOTSTRAP_SERVERS is read from it
      # (as environment variables, its client KAFKA_* settings would become
      # broker settings)
      - ../.env:/run/cedar.env:ro

    # the advertised address = the host of KAFKA_BOOTSTRAP_SERVERS, then the
    # image's normal start
    command:
      - bash
      - -c
      - |
        b=$$(sed -n 's/^[[:space:]]*KAFKA_BOOTSTRAP_SERVERS[[:space:]]*=//p' /run/cedar.env \
             | tail -1 | sed 's/[[:space:]]#.*//' | tr -d "\"' \r")
        b=$${b%%,*}; host=$${b%:*}; host=$${host:-localhost}
        export KAFKA_ADVERTISED_LISTENERS="EXTERNAL://$$host:8004,INTERNAL://kafka:9094"
        echo "===> advertising EXTERNAL://$$host:8004 (KAFKA_BOOTSTRAP_SERVERS of the root .env)"
        exec /etc/kafka/docker/run

    environment:
      # ---- KRaft -----------------------------------------------------------
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      # ---- Listeners -------------------------------------------------------
      #   EXTERNAL    host applications       localhost:8004  (production: kafka.cedar-heu-project.eu:8004)
      #   INTERNAL    kafka-init, below       kafka:9094
      #   CONTROLLER  KRaft, inside the broker only
      # (the names must not contain "SSL": the image's own SSL setup would take over)
      KAFKA_LISTENERS: EXTERNAL://:8004,INTERNAL://:9094,CONTROLLER://:9093
      # KAFKA_ADVERTISED_LISTENERS: set by the command above
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:SASL_SSL,INTERNAL:SASL_SSL,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # ---- TLS: broker certificate + CA, client certificate required ------
      KAFKA_SSL_KEYSTORE_TYPE: PEM
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/broker.pem
      KAFKA_SSL_TRUSTSTORE_TYPE: PEM
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka-cedar-ca-1.crt
      # on SASL_SSL listeners Kafka ignores the global ssl.client.auth:
      # it must be set per listener (listener.name.<name>.ssl.client.auth)
      KAFKA_LISTENER_NAME_EXTERNAL_SSL_CLIENT_AUTH: required
      KAFKA_LISTENER_NAME_INTERNAL_SSL_CLIENT_AUTH: required

      # ---- SASL PLAIN: users in kafka_server_jaas.conf ---------------------
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf"

      # ---- Single broker ---------------------------------------------------
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # ---- Topic creation (one-shot) -------------------------------------------
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: kafka-init
    hostname: kafka-init

    depends_on:
      - kafka

    volumes:
      - ./secrets/local/broker:/etc/kafka/secrets:ro

    entrypoint: ["/bin/bash", "-c"]

    command:
      - |
        CONFIG=/etc/kafka/secrets/admin-client.properties
        echo "Waiting for Kafka..."

        until /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9094 \
          --list \
          --command-config $$CONFIG >/dev/null 2>&1
        do
          echo "Kafka not ready yet..."
          sleep 2
        done

        echo "Kafka is ready."

        echo "Creating Kafka topics..."

        for topic in \
          it_analyse \
          it_results_available \
          sl_analyse \
          sl_results_available
        do
          echo "Creating topic: $$topic"

          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:9094 \
            --create \
            --if-not-exists \
            --topic "$$topic" \
            --partitions 1 \
            --replication-factor 1 \
            --command-config $$CONFIG
        done

        echo ""
        echo "Kafka topics created successfully."
        echo ""
        echo "Available topics:"

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9094 \
          --list \
          --command-config $$CONFIG
