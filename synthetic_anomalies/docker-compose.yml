# Local Neo4j + its HTTP gateway, seeded with the synthetic anomaly scenarios.
#
#   docker compose -f synthetic_anomalies/docker-compose.yml up -d --build
#   python synthetic_anomalies/test_synthetic.py          # score it (no Kafka)
#   docker compose -f synthetic_anomalies/docker-compose.yml down
#
# Settings come from the root .env (SYNTHETIC_GRAPH_API_KEY): the gateway
# requires it, the seeder sends it. The gateway is on localhost:8000, Neo4j's
# browser on localhost:7474.
name: cedar-synthetic

services:
  # ---- Neo4j (graph database) ----------------------------------------------
  neo4j:
    image: neo4j:latest
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # ---- HTTP endpoint exposing the graph ------------------------------------
  cedar-http-api:
    build: ../neo4j-api
    image: cedar-http-api
    container_name: cedar-http-api
    env_file: ../.env              # SYNTHETIC_GRAPH_API_KEY: the key clients must send
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    restart: on-failure

  # ---- Synthetic anomaly scenarios -> Neo4j (one-shot) ---------------------
  # Empties the local graph and loads data_generation.py's market, in the
  # pilot schema; then exits.
  synthetic-graph:
    build: { context: .., target: source }
    image: cedar-synthetic-seed
    container_name: synthetic-graph
    depends_on: [cedar-http-api]
    env_file: ../.env              # SYNTHETIC_GRAPH_API_KEY
    volumes:
      - ./:/app/synthetic_anomalies:ro
    environment:
      SYNTHETIC_GRAPH_ENDPOINT: http://cedar-http-api:8000/neo4j/query
      LOG_FILE: none
    entrypoint: ["python", "synthetic_anomalies/create_neo4j_graph.py"]
    restart: "no"
